name: Deploy to Pages

on:
  push:
    branches: [main]
    paths-ignore: ['_research/**']   # research-only commits skip deploys
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'sarrtle/home'   # private repo (home-private) never deploys Pages
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf _research        # research never gets published
      - name: Stage publish set
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml _site/
          cp -r css js assets blog _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
