<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Sarrtle default social card (og:image).
    Source of assets/og-default.png — regenerate with:
      rsvg-convert -w 1200 -h 630 tools/og-card.svg -o assets/og-default.png
    Palette mirrors css/styles.css :root variables.
  -->
  <rect width="1200" height="630" fill="#0b0e0d"/>

  <!-- brand mark lockup (top-left): matches assets/favicon.svg -->
  <rect x="84" y="72" width="48" height="48" rx="12" fill="#101412" stroke="#2c3531" stroke-width="1.5"/>
  <text x="108" y="105" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="24" font-weight="700" fill="#7fe08b" text-anchor="middle">S</text>
  <text x="146.5" y="104" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="21" fill="#7fe08b" letter-spacing="2">sarrtle</text>

  <!-- name -->
  <text x="84" y="286" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="108" font-weight="700" fill="#e9e7e0" letter-spacing="-2">Sarrtle</text>

  <!-- accent underline: same width as the rendered "Sarrtle" ink (431px, from x=7 of the glyph run) -->
  <rect x="91" y="322" width="431" height="5" rx="2.5" fill="#57d071"/>

  <!-- subtitle: wrapped across two lines (og:description text) -->
  <text x="84" y="404" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="30" fill="#a5aca7">Automation, web scraping, data collection, AI integration and</text>
  <text x="84" y="452" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="30" fill="#a5aca7">backend/API development, built by one independent programmer.</text>

  <!-- hairline -->
  <rect x="84" y="530" width="1032" height="1" fill="#232a27"/>

  <!-- website -->
  <rect x="84" y="563" width="9" height="9" rx="2" fill="#57d071"/>
  <text x="103" y="576" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="23" fill="#7fe08b">https://sarrtle.github.io/home/</text>
</svg>
